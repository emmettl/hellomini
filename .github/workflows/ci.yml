name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS 26 · Swift 6.3
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Hosted VMs may lack Metal. The physical Mini requires the GPU test to pass.
      MINI_ALLOW_MISSING_METAL: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check toolchain
        run: bash scripts/ci-check-toolchain.sh
      - name: Format, test, and build
        run: make check
      - name: Bundle release build
        run: make app CONFIGURATION=release
      - name: Verify and archive app
        run: bash scripts/ci-package.sh
      - name: Upload app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Hello-Mini-macos-arm64-${{ github.sha }}
          path: dist/Hello-Mini-macos-arm64.zip
          if-no-files-found: error
          retention-days: 14
